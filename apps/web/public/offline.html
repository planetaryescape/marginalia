<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#201d1b">
    <title>Offline · Marginalia</title>
    <style>
      :root { color-scheme: dark; background: #201d1b; color: #f3f1ef; }
      body { margin: 0; font: 16px/1.65 system-ui, sans-serif; }
      main { box-sizing: border-box; max-width: 32rem; margin: 15vh auto 0; padding: 2rem max(1.5rem, env(safe-area-inset-left)); }
      .wordmark { font: 24px Georgia, serif; }
      h1 { font: 38px/1.15 Georgia, serif; margin-top: 3rem; }
      p { color: #b3a99e; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; margin-top: 1rem; border-radius: 24px; background: #f3f1ef; color: #201d1b; text-decoration: none; }
      a:focus-visible { outline: 2px solid #7d9cf5; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">Marginalia</div>
      <h1>You’re offline.</h1>
      <p>Your library, articles and AI need a connection. This installed app doesn’t download your reading library or keep offline drafts.</p>
      <p>If you still have a note open in another window, keep it open until it says Saved. Don’t reload that window.</p>
      <a href="/">Try the reading desk again</a>
    </main>
  </body>
</html>
